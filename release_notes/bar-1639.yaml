---
- summary: Add `--remote-barman-path` to `barman-wal-archive` and `barman-wal-restore`
  description: |
    `barman-wal-archive` and `barman-wal-restore` now accept the
    `--remote-barman-path` option, which sets the directory containing the `barman`
    executable on the Barman server. This allows using the clients when `barman` is
    not in the `PATH`. When it is not set, the clients keep calling `barman` from the
    `PATH`, so existing setups are unaffected.
  type: minor_change
  jira_tickets:
    - BAR-1639
