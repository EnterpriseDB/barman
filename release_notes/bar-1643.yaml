---
- summary: 'Support for WarehousePG: Link restored tablespaces to the directory of the instance'
  description: |
    In WarehousePG, the data of a tablespace is stored in a directory named after
    the `dbid` of the instance, inside the tablespace location, and the link in
    `pg_tblspc` points to that directory. Barman used to point the link to the
    tablespace location, as it does for PostgreSQL.

    When restoring a WarehousePG backup, Barman now links the tablespaces to the
    directory of the `dbid`, both with `barman restore` and `barman-cloud-restore`.
    Restores of other PostgreSQL instances are not affected.
  type: minor_change
  jira_tickets:
    - BAR-1643
