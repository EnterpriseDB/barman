version: 3.21.0
date: 2026-11-17
relnotes:
  - summary: 'Support for WarehousePG: Link restored tablespaces to the directory
      of the instance'
    description: |-
      In WarehousePG, the data of a tablespace is stored in a directory named after
      the `dbid` of the instance, inside the tablespace location, and the link in
      `pg_tblspc` points to that directory. Barman used to point the link to the
      tablespace location, as it does for PostgreSQL.

      When restoring a WarehousePG backup, Barman now links the tablespaces to the
      directory of the `dbid`, both with `barman restore` and `barman-cloud-restore`.
      Restores of other PostgreSQL instances are not affected.
    jira_tickets:
      - BAR-1643
    support_tickets: []
    type: minor_change
  - summary: '`barman check-backup` now exits with an error for backups waiting for
      WALs'
    description: |-
      Previously, `barman check-backup` exited with `0` and printed nothing when
      the backup was `WAITING_FOR_WALS`, so callers could not tell that the backup
      consistency had not been verified yet.

      The command now prints an error message and exits with code `1` in that
      case. It exits with `0` only for `DONE` backups, and with `1` for `FAILED`
      or `WAITING_FOR_WALS` backups, or when the check could not be performed,
      for example because another process holds the backup lock. The exit codes
      are documented in the command reference.

      **Behavior change**: scripts that run `barman check-backup` and expect `0`
      for backups still waiting for WALs must handle the new exit code. The
      periodic checks run by `barman cron` are not affected.
    jira_tickets:
      - BAR-1633
    support_tickets: []
    type: minor_change
  - summary: 'Support for WarehousePG: Back up tablespaces on rsync backups'
    description: |-
      WarehousePG does not store the contents of a tablespace directly under the
      tablespace location, as PostgreSQL does. Instead, each instance sharing the
      location has its own directory, named after its `dbid`, which contains the
      tablespace data:

      ```
      <location>/<dbid>/GPDB_<major_version>_*/...
      ```

      Barman now also supports the WarehousePG tablespace directory layout during rsync
      backups.
    jira_tickets:
      - BAR-1641
    support_tickets: []
    type: minor_change
  - summary: 'Support for WarehousePG: Allow concurrent restores that share a tablespace
      location'
    description: |-
      Restores of WarehousePG segments that share a tablespace location could fail
      with `Unable to remove file`, because they used the same file name to check
      that the directory is writable. Each check now uses its own unique file name.
    jira_tickets:
      - BAR-1634
    support_tickets: []
    type: minor_change
  - summary: Add `--remote-barman-path` to `barman-wal-archive` and `barman-wal-restore`
    description: |-
      `barman-wal-archive` and `barman-wal-restore` now accept the
      `--remote-barman-path` option, which sets the directory containing the `barman`
      executable on the Barman server. This allows using the clients when `barman` is
      not in the `PATH`. When it is not set, the clients keep calling `barman` from the
      `PATH`, so existing setups are unaffected.
    jira_tickets:
      - BAR-1639
    support_tickets: []
    type: minor_change
  - summary: Fix inactive servers modifying the shared backup catalog
    description: |-
      Barman 3.20.0 allowed `check-backup` and `keep` to run on inactive servers
      (`active = false`), and `delete` was also allowed. That is only safe when the
      inactive server owns its backup catalog. When several Barman installations
      share the same cloud bucket, and an inactive one does not own the catalog,
      these commands could:

      * overwrite the status of a backup in the shared catalog with `check-backup`.
        A check that saw a different set of WAL files could mark a good backup as
        `FAILED` for every installation.
      * write keep annotations to the shared bucket with `keep`.
      * delete a backup that was marked to be kept by the installation that owns
        it with `delete`, as that keep annotation was not taken into account.

      `check-backup`, `keep` and `delete` are now skipped on inactive servers, as
      `check-backup` and `keep` were before 3.20.0. Read-only and diagnostic
      commands, `restore`, `get-wal`, `cloud-wal-restore` and `terminate-process`
      remain available.
    jira_tickets:
      - BAR-1645
    support_tickets: []
    type: minor_change
  - summary: 'Support for WarehousePG: Detect the WAL retention setting in use by
      the server'
    description: |-
      Barman used to choose between `wal_keep_segments` and `wal_keep_size`
      according to the PostgreSQL version reported by the server. This does not
      hold for WarehousePG 7, which is based on PostgreSQL 12 but uses the
      `wal_keep_size` name introduced in PostgreSQL 13.

      Barman now checks which of the two parameters the server has, instead of
      relying on the server version. This way, `barman show-server` reports the
      WAL retention setting of WarehousePG 7, and Barman no longer requests a
      parameter that does not exist in the server.
    jira_tickets:
      - BAR-1640
    support_tickets: []
    type: minor_change
  - summary: 'Support for WarehousePG: Detect WarehousePG instances and save their
      metadata in the backup'
    description: |-
      Barman now detects when it is connected to a WarehousePG instance by checking
      whether the `gp_dbid` and `gp_server_version_num` settings exist, and fails if
      only one of them does. When backing up a WarehousePG instance, these values are
      saved in the backup metadata and shown by `barman show-backup`. Backups of
      other PostgreSQL instances are not affected.

      The `warehousepg_dbid` configuration option is deprecated and no longer has any
      effect. Barman now infers the database id from the instance it is connected to
      through `conninfo`, and passes it to `pg_basebackup` for every `postgres`
      backup, including the ones uploaded straight to the cloud, which did not
      receive it before. Barman warns about the option when reading the
      configuration, and it should be removed from it.

      The documentation has a new WarehousePG page describing how to connect to
      WarehousePG instances, and what Barman does, and does not do, for WarehousePG
      clusters.
    jira_tickets:
      - BAR-1660
    support_tickets: []
    type: minor_change
  - summary: 'Support for WarehousePG: Back up tablespaces to cloud object storage'
    description: |-
      WarehousePG does not store the contents of a tablespace directly under the
      tablespace location, as PostgreSQL does. Instead, each instance sharing the
      location has its own directory, named after its `dbid`, which contains the
      tablespace data:

      ```
      <location>/<dbid>/GPDB_<major_version>_*/...
      ```

      Barman now also supports the WarehousePG tablespace directory layout for cloud backups.
    jira_tickets:
      - BAR-1663
    support_tickets: []
    type: minor_change
  - summary: Fix unrelated directories being included in cloud backups of tablespaces
    description: |-
      When taking a backup to cloud object storage, Barman only intends to back
      up the `PG_<major>_*` directory of each tablespace. However, directories
      inside the tablespace location could still be included in the tablespace backup.
      This caused undesired behaviors, such as when tablespace located inside PGDATA
      would have its contents duplicated in the backup.

      Barman now correctly handles tablespace directories, ensuring that only the
      intended `PG_<major>_*` directories are included in the backup.
    jira_tickets:
      - BAR-1635
    support_tickets: []
    type: bugfix
  - summary: Fix WAL existence checks for cloud WAL storage when compression differs
    description: |-
      When WALs are stored in cloud storage, `check-backup`,
      `check-archived-wal-range` and the wait for WALs to be archived (as in
      `switch-wal --archive` and `backup --wait`) looked for each WAL using the
      extension of the `compression` currently configured for the server. WALs
      archived with a different compression, or none, were wrongly reported as
      missing. This happened, for example, when `compression` was changed after
      some WALs had been archived. In the case of `check-backup`, healthy backups
      were marked as `FAILED`.

      These commands now find the WAL regardless of its compression, as
      `barman cloud-wal-restore` already does.
    jira_tickets:
      - BAR-1628
    support_tickets: []
    type: bugfix
  - summary: Fix backups to Google Cloud Storage failing on Python 3.14
    description: |-
      When running on Python 3.14, backups to Google Cloud Storage failed as soon
      as Barman started uploading data, even with a single upload job, with the
      error `Backup failed uploading data (Pickling client objects is explicitly
      not supported.)`.

      This happened because Python 3.14 changed the default way subprocesses are
      started on Linux, from `fork` to `forkserver`, which the Google Cloud
      Storage upload code was not compatible with. This issue is now fixed.

      Special thanks to @dpippenger who reported and contributed to this fix in
      the PR #1236.
    jira_tickets:
      - BAR-1670
    support_tickets: []
    type: bugfix
  - summary: Fix parallel WAL archiving failing on Python 3.14
    description: |-
      When running on Python 3.14, archiving WAL files in parallel did not work.
      The additional WAL files requested through the `--parallel` option of
      `barman cloud-wal-archive` (or through the `cloud_wal_archive_parallel`
      server option) could not be archived, because the worker processes failed
      to start with a `TypeError` mentioning `CsvOption.__init__()`.

      This happened because Python 3.14 changed how new processes are started on
      Linux, from `fork` to `forkserver`. Barman now explicitly starts the worker
      processes with the `fork` start method, ensuring compatibility with Python 3.14.
    jira_tickets:
      - BAR-1646
    support_tickets: []
    type: bugfix
  - summary: Fix Barman not deleting compressed WAL files from cloud storage
    description: |-
      When using the `local-to-cloud` backup method, or the `postgres` backup
      method with `s3://` URLs for `wals_directory`, Barman silently failed to delete
      compressed WAL files from the cloud storage when applying retention policies,
      leaving unneeded files in the storage forever.

      The issue is fixed for WAL files archived after upgrading. WAL files that
      were archived by earlier versions are still recorded without their
      compression in the WAL catalog, so Barman is still unable to delete them.
      Those files have to be removed manually from the cloud storage.

      Note: this bug only affects Barman servers running with backup method `local-to-cloud`
      or `postgres` with `s3://` URLs for `wals_directory`.
    jira_tickets:
      - BAR-1629
    support_tickets: []
    type: bugfix
  - summary: Fix delta restore removing unrelated content from tablespace locations
    description: |-
      A delta restore removed everything in a tablespace location that was not part
      of the backup. This included content that belongs to something else, such as the
      directory of the old Postgres major version left in the location by
      `pg_upgrade`.
      Now only the extra files within the backup's own tablespace directory
      (`PG_<major>_<catversion>`) are removed, and any other content in the location
      is kept.
    jira_tickets:
      - BAR-1637
    support_tickets: []
    type: bugfix
  - summary: Reject delta restore of cloud backups to a local destination
    description: |-
      When restoring a backup stored in cloud storage to a local destination,
      Barman accepted `--delta-restore` (or `delta-restore` in `recovery_options`)
      without performing an actual delta restore. Delta restores are not possible
      for local restores of cloud backups at the moment.

      `barman restore` now exits with an error in that case, as it already does
      for local restores of incremental, compressed or encrypted backups. Restores
      of cloud backups to a remote destination are not affected.

      If `delta-restore` is set in `recovery_options`, use `--no-delta-restore` to
      restore cloud backups locally.
    jira_tickets:
      - BAR-1636
    support_tickets: []
    type: bugfix
  - summary: Fix local restore of cloud backups overwriting backup.info in cloud storage
    description: |-
      When restoring a backup stored in cloud storage to a local directory, Barman
      uploaded a copy of the `backup.info` file back to the bucket, replacing the
      catalog object. As a consequence, `barman restore` required write access to
      the bucket, and restores performed from a second Barman instance reading the
      same catalog would write to the catalog of the primary site.

      Barman now only updates `backup.info` in cloud storage when the backup
      catalog itself is modified. Restores no longer write to the bucket.

      This issue was introduced in Barman 3.19.0.
    jira_tickets:
      - BAR-1630
    support_tickets: []
    type: bugfix
  - summary: Fix `FileNotFoundError` traceback printed at exit by `barman-cloud-backup`
      on Python 3.13+
    description: |-
      On Python 3.13 and later, `barman-cloud-backup` printed a `FileNotFoundError`
      traceback at exit after a successful backup, causing confusion for users. The
      backup itself was not affected. This was caused by a temporary directory being
      removed twice after some behavior changes of Python 3.13.

      This has been fixed, and the traceback is no longer printed.

      Contribution from @Muhtasim-Munif-Fahim.
    jira_tickets:
      - BAR-1673
    support_tickets: []
    type: bugfix
  - summary: Resolve backup names for backups in any status
    description: |-
      Backup names given to `barman backup --name` were only resolved for backups
      in `WAITING_FOR_WALS` or `DONE` status. For `STARTED` and `FAILED` backups,
      commands such as `delete`, `show-backup` and `check-backup` failed with
      `Unknown backup`, although `list-backup` showed the name and the same
      commands worked with the backup ID. This made it hard to clean up failed
      backups by name.

      Backup names now resolve for backups in any status, as backup IDs do.
      Commands which require a usable backup, such as `restore`, keep checking
      the backup status and report an error for backups that cannot be used.

      As before, if more than one backup has the same name, commands fail with
      an error listing the IDs of the matching backups, and the backup ID must be
      used instead. This now also takes `STARTED` and `FAILED` backups into
      account, for example when a failed backup is retried using the same name.
    jira_tickets:
      - BAR-1638
    support_tickets: []
    type: bugfix
