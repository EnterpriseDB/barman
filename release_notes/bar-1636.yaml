---
- summary: Reject delta restore of cloud backups to a local destination
  description: |
    When restoring a backup stored in cloud storage to a local destination,
    Barman accepted `--delta-restore` (or `delta-restore` in `recovery_options`)
    without performing an actual delta restore. Delta restores are not possible
    for local restores of cloud backups at the moment.

    `barman restore` now exits with an error in that case, as it already does
    for local restores of incremental, compressed or encrypted backups. Restores
    of cloud backups to a remote destination are not affected.

    If `delta-restore` is set in `recovery_options`, use `--no-delta-restore` to
    restore cloud backups locally.
  type: bugfix
  jira_tickets:
    - BAR-1636
