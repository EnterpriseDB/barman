---
- summary: Fix `FileNotFoundError` traceback printed at exit by `barman-cloud-backup`
    on Python 3.13+
  description: |
    On Python 3.13 and later, `barman-cloud-backup` printed a `FileNotFoundError`
    traceback at exit after a successful backup, causing confusion for users. The
    backup itself was not affected. This was caused by a temporary directory being
    removed twice after some behavior changes of Python 3.13.

    This has been fixed, and the traceback is no longer printed.

    Contribution from @Muhtasim-Munif-Fahim.
  type: bugfix
  jira_tickets:
    - BAR-1673
