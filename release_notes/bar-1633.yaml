---
- summary: "`barman check-backup` now exits with an error for backups waiting for WALs"
  description: |
    Previously, `barman check-backup` exited with `0` and printed nothing when
    the backup was `WAITING_FOR_WALS`, so callers could not tell that the backup
    consistency had not been verified yet.

    The command now prints an error message and exits with code `1` in that
    case. It exits with `0` only for `DONE` backups, and with `1` for `FAILED`
    or `WAITING_FOR_WALS` backups, or when the check could not be performed,
    for example because another process holds the backup lock. The exit codes
    are documented in the command reference.

    **Behavior change**: scripts that run `barman check-backup` and expect `0`
    for backups still waiting for WALs must handle the new exit code. The
    periodic checks run by `barman cron` are not affected.
  type: minor_change
  jira_tickets:
    - BAR-1633
