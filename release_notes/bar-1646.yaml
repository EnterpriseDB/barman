---
- summary: Fix parallel WAL archiving failing on Python 3.14
  description: |
    When running on Python 3.14, archiving WAL files in parallel did not work.
    The additional WAL files requested through the `--parallel` option of
    `barman cloud-wal-archive` (or through the `cloud_wal_archive_parallel`
    server option) could not be archived, because the worker processes failed
    to start with a `TypeError` mentioning `CsvOption.__init__()`.

    This happened because Python 3.14 changed how new processes are started on
    Linux, from `fork` to `forkserver`. Barman now explicitly starts the worker
    processes with the `fork` start method, ensuring compatibility with Python 3.14.
  type: bugfix
  jira_tickets:
    - BAR-1646
