---
- summary: Fix WAL existence checks for cloud WAL storage when compression differs
  description: |
    When WALs are stored in cloud storage, `check-backup`,
    `check-archived-wal-range` and the wait for WALs to be archived (as in
    `switch-wal --archive` and `backup --wait`) looked for each WAL using the
    extension of the `compression` currently configured for the server. WALs
    archived with a different compression, or none, were wrongly reported as
    missing. This happened, for example, when `compression` was changed after
    some WALs had been archived. In the case of `check-backup`, healthy backups
    were marked as `FAILED`.

    These commands now find the WAL regardless of its compression, as
    `barman cloud-wal-restore` already does.
  type: bugfix
  jira_tickets:
    - BAR-1628
